[build]
  publish = "."

# Old Webflow login / CMS template URLs -> home
[[redirects]]
  from = "/log-in"
  to = "/"
  status = 301
[[redirects]]
  from = "/sign-up"
  to = "/"
  status = 301
[[redirects]]
  from = "/reset-password"
  to = "/"
  status = 301
[[redirects]]
  from = "/update-password"
  to = "/"
  status = 301
[[redirects]]
  from = "/user-account"
  to = "/"
  status = 301
[[redirects]]
  from = "/access-denied"
  to = "/"
  status = 301
[[redirects]]
  from = "/products/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/blog-categories/*"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
